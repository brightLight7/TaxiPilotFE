<div *ngIf="type === 'text'" class="loading-placeholder-text">
    <div class="loading-spinner"></div>
  </div>
  <div *ngIf="type === 'div'" class="loading-placeholder-div">
    <div class="loading-spinner"></div>
  </div>
  <div *ngIf="type === 'custom'" [innerHTML]="customTemplate" class="loading-placeholder-custom">
  </div>
