<div id={{Id}} class="div-select-airport">
  <select (change)="onSelectionChange($event)" id="airport" [formControl]="airportSelected" class="sm-select sajid"  appAriaAccessibility>
    <option value="" selected disabled >Select an airport</option>
    <option *ngFor="let location of locations; " [value]="location.name" >
      {{ location.name }}
    </option>
  </select>
</div>
