<span #spanContainer [ngClass]="flexDirection == 'column' ? 'flexDirectionColumn' : 'flexDirectionRow'">
  <span *ngIf="label">
<label class='lbl' for="{{id}}">{{label}}</label>
<i id="mandatory-star" *ngIf="mandatory" class="fa fa-asterisk"></i>
</span>
<input #formInput name="input" type="{{type}}" id="{{id}}" placeholder="{{placeholder}}"
              [ngClass]="[class, deleteButtonOn ? 'inputPadding8px' : '']"

              (keyup)="inputChange()"
              [attr.required]="mandatory ? true : null"
           />
<button #deleteCross *ngIf="deleteButtonOn == true"  id="del-button"
(click)="crossClick()"   >
  <i class="fa fa-times" ></i>
</button>
